[project]
name = "fitscorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PriyankaDani", email = "priyanka.dani1497@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.15",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[project.scripts]
fitscorer = "fitscorer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits real Ollama; run manually with `uv run pytest -m integration`"]
addopts = "-m 'not integration'"
